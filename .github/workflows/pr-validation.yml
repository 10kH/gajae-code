name: PR contract

on:
  # This workflow is loaded from the trusted default branch. It never executes
  # code from the pull request; the base-owned validator only inspects checked-out bytes.
  pull_request_target:
    branches: [dev]
    types: [opened, edited, synchronize, reopened, ready_for_review]
  pull_request_review:
    branches: [dev]
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate exact-head PR contract
    # Enabled directly on dev after this workflow and validator land. Until then,
    # the pre-existing Dev CI bootstrap is the trusted phase-one authority.
    if: ${{ false }}

    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-head
          persist-credentials: false
      - name: Check out trusted validator from immutable event base
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-base
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: "1.3.14"
      - name: Validate body, exact head, immutable base, reviewer, and fast gate
        env:
          GITHUB_ACTOR: ${{ github.event.pull_request.user.login }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          unset BUN_OPTIONS
          trusted_root="$PWD/trusted-base"
          repo_root="$PWD/pr-head"
          empty_bunfig="$RUNNER_TEMP/gjc-pr-contract-empty-bunfig.toml"
          printf '# trusted empty Bun configuration\n' > "$empty_bunfig"
          cd "$trusted_root"
          bun --no-env-file --config="$empty_bunfig" "$trusted_root/scripts/verify-pr-verdict.ts" \
            --event "$GITHUB_EVENT_PATH" --repo "$repo_root" --trusted-root "$trusted_root"
