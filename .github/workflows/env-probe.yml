name: Env probe
on:
   workflow_dispatch:
permissions:
   contents: read
jobs:
   meta:
      runs-on: ubuntu-22.04
      outputs:
         channel: ${{ steps.release.outputs.channel }}
      steps:
         - id: release
           shell: bash
           run: echo "channel=stable" >> "$GITHUB_OUTPUT"
   skipped_gate:
      if: ${{ false }}
      runs-on: ubuntu-22.04
      steps:
         - run: echo "never"
   prepare_like:
      if: ${{ always() && needs.meta.outputs.channel == 'stable' }}
      needs: [meta, skipped_gate]
      runs-on: ubuntu-22.04
      steps:
         - run: echo "prepare_like ran"
   approval_no_always:
      if: ${{ needs.prepare_like.result == 'success' && needs.meta.outputs.channel == 'stable' }}
      needs: [prepare_like, meta]
      runs-on: ubuntu-22.04
      steps:
         - run: echo "approval_no_always ran"
   approval_with_always:
      if: ${{ always() && needs.prepare_like.result == 'success' && needs.meta.outputs.channel == 'stable' }}
      needs: [prepare_like, meta]
      runs-on: ubuntu-22.04
      steps:
         - run: echo "approval_with_always ran"
